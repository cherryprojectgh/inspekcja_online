<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Próba aparatu | Inspekcja online</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #faf8fc; color: #3e3e3e; font-family: "Plus Jakarta Sans", Arial, Helvetica, sans-serif; font-size: 1rem; line-height: 1.6; }
    main { margin: 24px auto; width: min(100% - 32px, 36rem); padding: clamp(16px, 4vw, 24px); background: #fff; border: 1px solid #e7dfec; border-radius: 14px; }
    h1 { margin: 0 0 8px; color: #501e82; font-size: 1.75rem; line-height: 1.2; }
    p { margin: 0 0 16px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { min-height: 44px; padding: 8px 16px; border: 1px solid #a50f82; border-radius: 6px; background: #a50f82; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { background: #fff; color: #850b69; }
    button:disabled { background: #eeeaf0; border-color: #eeeaf0; color: #68616e; cursor: default; }
    button:focus-visible { outline: 3px solid #501e82; outline-offset: 3px; }
    #status { margin: 16px 0 0; }
    video, img { display: block; width: 100%; max-height: 56vh; margin-top: 12px; border-radius: 10px; object-fit: contain; background: #241235; }
  </style>
</head>
<body>
  <main>
    <h1>Próba aparatu</h1>
    <p>Zrób zdjęcie paska z fikcyjnym VIN-em. Sprawdź, czy cały numer jest czytelny na podglądzie.</p>
    <div class="actions">
      <button id="start" type="button">Uruchom aparat</button>
      <button id="capture" type="button" hidden>Zrób zdjęcie</button>
      <button id="cancel" type="button" class="secondary" hidden>Zamknij aparat</button>
    </div>
    <p id="status" role="status">Zdjęcie zostaje w tej karcie przeglądarki.</p>
    <video id="camera" autoplay muted playsinline aria-label="Obraz z aparatu" hidden></video>
    <div id="preview" hidden></div>
  </main>
  <script>
    const start = document.querySelector('#start');
    const capture = document.querySelector('#capture');
    const cancel = document.querySelector('#cancel');
    const camera = document.querySelector('#camera');
    const preview = document.querySelector('#preview');
    const status = document.querySelector('#status');
    let stream;
    let previewUrl;
    let attempt = 0;

    function showPreview(message) {
      attempt += 1;
      const oldStream = stream;
      stream = undefined;
      for (const track of oldStream?.getTracks() ?? []) track.stop();
      camera.srcObject = null;
      camera.hidden = true;
      capture.hidden = true;
      cancel.hidden = true;
      preview.hidden = !previewUrl;
      start.hidden = false;
      start.textContent = previewUrl ? 'Powtórz' : 'Uruchom aparat';
      status.textContent = message;
    }

    start.addEventListener('click', async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent = 'Otwórz link HTTPS bezpośrednio w Safari lub Chrome.';
        return;
      }

      const currentAttempt = ++attempt;
      start.hidden = true;
      cancel.hidden = false;
      status.textContent = 'Zezwól przeglądarce na dostęp do aparatu.';
      try {
        const openedStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        });
        if (currentAttempt !== attempt) {
          for (const track of openedStream.getTracks()) track.stop();
          return;
        }
        if (document.hidden) {
          for (const track of openedStream.getTracks()) track.stop();
          showPreview('Aparat zamknięty. Możesz uruchomić go ponownie.');
          return;
        }
        stream = openedStream;
        openedStream.getVideoTracks()[0].addEventListener('ended', () => {
          if (currentAttempt === attempt) showPreview('Aparat został rozłączony. Uruchom go ponownie.');
        }, { once: true });
        preview.hidden = true;
        camera.hidden = false;
        camera.srcObject = openedStream;
        await camera.play();
        if (currentAttempt !== attempt) return;
        capture.hidden = false;
        capture.disabled = false;
        status.textContent = 'Ustaw pasek VIN w kadrze.';
      } catch (error) {
        if (currentAttempt !== attempt) return;
        showPreview(error.name === 'NotAllowedError'
          ? 'Sprawdź uprawnienia aparatu dla tej strony i spróbuj ponownie.'
          : 'Aparat jest niedostępny. Zamknij inne aplikacje korzystające z aparatu i spróbuj ponownie.');
      }
    });

    capture.addEventListener('click', () => {
      if (!stream || camera.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || !camera.videoWidth) {
        status.textContent = 'Poczekaj na obraz z aparatu i spróbuj ponownie.';
        return;
      }
      capture.disabled = true;
      const currentAttempt = attempt;
      const frame = document.createElement('canvas');
      const scale = Math.min(1, 2048 / Math.max(camera.videoWidth, camera.videoHeight));
      frame.width = Math.round(camera.videoWidth * scale);
      frame.height = Math.round(camera.videoHeight * scale);
      frame.getContext('2d').drawImage(camera, 0, 0, frame.width, frame.height);
      frame.toBlob((photo) => {
        if (currentAttempt !== attempt) return;
        if (!photo || photo.size > 4 * 1024 * 1024) {
          capture.disabled = false;
          status.textContent = 'Nie udało się przygotować zdjęcia. Spróbuj ponownie.';
          return;
        }
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(photo);
        const image = new Image();
        image.alt = 'Podgląd wykonanego zdjęcia';
        image.src = previewUrl;
        preview.replaceChildren(image);
        showPreview('Sprawdź, czy cały VIN jest czytelny na zdjęciu.');
        start.focus();
      }, 'image/jpeg', 0.88);
    });

    cancel.addEventListener('click', () => {
      showPreview('Aparat zamknięty. Możesz uruchomić go ponownie.');
      start.focus();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && stream) showPreview('Aparat zamknięty. Możesz uruchomić go ponownie.');
    });
    window.addEventListener('pagehide', () => {
      if (stream || !cancel.hidden) showPreview('Aparat zamknięty. Możesz uruchomić go ponownie.');
    });
  </script>
</body>
</html>
